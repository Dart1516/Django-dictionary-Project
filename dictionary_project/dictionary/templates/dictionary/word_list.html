{# Navigation links, repeated on every page #}
<p><a href="{% url 'dictionary:search_page' %}">Search</a> | <a href="{% url 'dictionary:word_list' %}">My Vocabulary</a></p>

<h1>My Vocabulary</h1>

{# saved_words comes from WordListView in views.py #}
{% if saved_words %}
    <ul>
    {% for saved_word in saved_words %}
        <li><a href="{% url 'dictionary:word_detail' saved_word.id %}">{{ saved_word.word }}</a></li>
    {% endfor %}
    </ul>
{% else %}
    <p>No words saved yet.</p>
{% endif %}
